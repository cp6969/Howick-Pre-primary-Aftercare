services:
  app:
    build: .
    container_name: howick-aftercare-tracker
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      # 8088 = Immich, 8089 = Shipments Tracker on this box (see that repo's
      # handover doc) -- 8090 is the next free port for this app.
      # Reach it directly on the LAN at http://<unraid-ip>:8090
      - "8090:3000"

  # Optional -- gives this app its own public URL via Cloudflare Tunnel,
  # completely independent of the Shipments Tracker's tunnel (nothing here
  # touches that app's containers). Remove this service (and use nginx, or
  # just LAN access above) if you don't want a second cloudflared container.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: howick-aftercare-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - app
